# Пересборка лендинга anirates.ru после выхода релиза.
#
# Лендинг тянет данные о выпуске (версия, размер, контрольные суммы, история
# изменений) только во время сборки: scripts/apk-checksums.mjs качает APK и
# version.json с этого Pages, scripts/release-history.mjs собирает историю по
# коммитам этого репозитория. Пересобирается сайт при этом лишь на push в свой
# master. Без этого workflow страница /download продолжает предлагать прошлую
# версию, пока лендинг не тронут по другому поводу: так он и отстал на 1.0.29,
# когда здесь уже лежала 1.1.0.
#
# Почему триггер здесь, а не в репозитории приложения: сюда коммит приезжает
# уже ПОСЛЕ успешной сборки APK, то есть событие «релиз действительно вышел»
# случается именно тут. Коммит делает release.yml приложения под своим PAT
# (RELEASE_TOKEN), а не под GITHUB_TOKEN, поэтому push отсюда workflow'ы
# запускает: правило «события от GITHUB_TOKEN не порождают новых прогонов» на
# него не распространяется.
#
# Почему SSH на сервер, а не запуск workflow'а лендинга через API: репозиторий
# лендинга приватный и принадлежит другому аккаунту. Fine-grained токен туда не
# выписать в принципе (он умеет только репозитории своего владельца), а classic
# PAT со scope repo — это ключ ко ВСЕМ репозиториям его владельца, лежащий в
# секретах публичного репозитория. Собирает лендинг всё равно сервер, GitHub в
# этой цепочке лишь посредник, поэтому обращаемся к серверу напрямую. Ключ ниже
# заперт forced command'ом на /usr/local/sbin/anirate-site-deploy и не даёт ни
# шелла, ни доступа к одному-единственному репозиторию на GitHub.
name: Пересобрать лендинг

on:
  push:
    branches: [main]
    # Каждый релиз трогает version.json. Фильтр отсекает правки README и ручные
    # коммиты, ради которых лендинг пересобирать незачем.
    paths: ['version.json']
  workflow_dispatch:

# Два релиза подряд не должны дёргать сборку внахлёст: на сервере она защищена
# flock'ом, и второй прогон просто отобьётся как «деплой уже выполняется».
concurrency:
  group: rebuild-landing
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      # ── Ждём, пока Pages реально отдаст новую версию ──────────────────
      # Коммит в этот репозиторий и публикация на diohis.github.io — разные
      # события: между ними работает pages-build-deployment. Собрать лендинг
      # раньше — значит взять старый version.json и получить сайт, который сам
      # себе противоречит: кнопка ведёт на новый APK, а версия и контрольные
      # суммы под ней остались от прошлого выпуска.
      - name: Дождаться публикации на Pages
        run: |
          set -euo pipefail
          want=$(jq -r '.version' version.json)
          echo "ждём версию $want"
          # 40 попыток по 15 секунд — десять минут. Публикация занимает обычно
          # меньше минуты; запас на случай, когда у GitHub плохой день.
          for i in $(seq 1 40); do
            # Строка запроса обходит кеш CDN: сам по себе Pages сбрасывает кеш
            # при публикации, но ждать мы обязаны факта, а не вероятности.
            live=$(curl -fsS --max-time 10 \
                     "https://diohis.github.io/AniRate-releases/version.json?probe=${GITHUB_RUN_ID}-${i}" \
                   | jq -r '.version' 2>/dev/null || echo '')
            if [ "$live" = "$want" ]; then
              echo "Pages отдаёт $live, попытка $i"
              exit 0
            fi
            echo "попытка $i: Pages отдаёт '${live:-нет ответа}', ждём $want"
            sleep 15
          done
          echo "Pages так и не опубликовал $want за 10 минут"
          # Падаем осознанно, вместо того чтобы собрать лендинг на старых данных:
          # красный прогон видно, и он перезапускается одной кнопкой, а молча
          # собранный сайт со старой версией никто не заметит.
          exit 1

      # ── Просим сервер пересобрать лендинг ─────────────────────────────
      - name: Пересобрать лендинг
        env:
          SSH_KEY: ${{ secrets.SITE_SSH_KEY }}
          SSH_HOST: ${{ secrets.SITE_SSH_HOST }}
          SSH_USER: ${{ secrets.SITE_SSH_USER }}
          SSH_HOST_KEY: ${{ secrets.SITE_SSH_HOST_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          # Мусор в конце строк переживает дорогу до секрета незаметно: CR
          # остаётся от Windows, пробелы — от терминала, который добивает строки
          # до ширины окна. OpenSSH такой base64 не разбирает и падает невнятным
          # «error in libcrypto», где ни про пробелы, ни про перевод строки нет
          # ни слова.
          printf '%s\n' "$SSH_KEY" | tr -d '\r' | sed -e 's/[[:space:]]*$//' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keygen -y -f ~/.ssh/deploy_key >/dev/null \
            || { echo "Секрет SITE_SSH_KEY не парсится как приватный ключ"; exit 1; }
          # Отпечаток хоста закреплён секретом, а не собирается ssh-keyscan'ом:
          # keyscan доверяет тому, кто ответил, и в первый же MITM пропишет
          # чужой ключ как доверенный, а вместе с ним отдаст туда наш.
          printf '%s\n' "$SSH_HOST_KEY" | tr -d '\r' | sed -e 's/[[:space:]]*$//' > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          # `latest` вместо коммита: какой именно коммит сейчас в master у
          # лендинга, этот репозиторий знать не может и не должен. Сервер сам
          # развернёт его в SHA после fetch. Вывод скрипта возвращается сюда,
          # поэтому сборку лендинга видно прямо в логе этого прогона.
          ssh -i ~/.ssh/deploy_key \
              -o IdentitiesOnly=yes \
              -o BatchMode=yes \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile=~/.ssh/known_hosts \
              -o ConnectTimeout=20 \
              "${SSH_USER}@${SSH_HOST}" "deploy latest"

      - name: Убрать ключ
        if: always()
        run: rm -f ~/.ssh/deploy_key
