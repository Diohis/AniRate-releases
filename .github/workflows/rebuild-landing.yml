# Пересборка лендинга anirates.ru после выхода релиза.
#
# Лендинг тянет данные о выпуске (версия, размер, контрольные суммы, история
# изменений) только во время сборки: scripts/apk-checksums.mjs качает APK и
# version.json с этого Pages, scripts/release-history.mjs собирает историю по
# коммитам этого репозитория. Пересобирается сайт при этом лишь на push в свой
# master. Без этого workflow страница /download продолжает предлагать прошлую
# версию, пока лендинг не тронут по другому поводу: так он и отстал на 1.0.29,
# когда в релизах уже лежала 1.1.0.
#
# Почему триггер здесь, а не в репозитории приложения: сюда коммит приезжает
# уже ПОСЛЕ успешной сборки APK, то есть событие «релиз действительно вышел»
# случается именно тут. Коммит делает release.yml приложения под своим PAT
# (RELEASE_TOKEN), а не под GITHUB_TOKEN, поэтому push отсюда workflow'ы
# запускает: правило «события от GITHUB_TOKEN не порождают новых прогонов» на
# него не распространяется.
name: Пересобрать лендинг

on:
  push:
    branches: [main]
    # Каждый релиз трогает version.json. Фильтр отсекает правки README и ручные
    # коммиты, ради которых лендинг пересобирать незачем.
    paths: ['version.json']
  workflow_dispatch:

# Два релиза подряд не должны дёргать деплой лендинга внахлёст: на сервере он
# делит один рабочий каталог и защищён flock'ом, который второй прогон просто
# отобьёт как «деплой уже выполняется».
concurrency:
  group: rebuild-landing
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # ── Ждём, пока Pages реально отдаст новую версию ──────────────────
      # Коммит в этот репозиторий и публикация на diohis.github.io — разные
      # события: между ними работает pages-build-deployment. Дёрнуть лендинг
      # раньше — значит собрать его по старому version.json и получить сайт,
      # который сам себе противоречит: кнопка ведёт на новый APK, а версия и
      # контрольные суммы под ней от прошлого выпуска.
      - name: Дождаться публикации на Pages
        run: |
          set -euo pipefail
          want=$(jq -r '.version' version.json)
          echo "ждём версию $want"
          # 40 попыток по 15 секунд — десять минут. Публикация занимает
          # обычно меньше минуты; запас на случай, когда у GitHub плохой день.
          for i in $(seq 1 40); do
            # Строка запроса обходит кеш CDN: сам по себе Pages сбрасывает кеш
            # при публикации, но ждать мы обязаны факта, а не вероятности.
            live=$(curl -fsS --max-time 10 \
                     "https://diohis.github.io/AniRate-releases/version.json?probe=${GITHUB_RUN_ID}-${i}" \
                   | jq -r '.version' 2>/dev/null || echo '')
            if [ "$live" = "$want" ]; then
              echo "Pages отдаёт $live, попытка $i"
              exit 0
            fi
            echo "попытка $i: Pages отдаёт '${live:-нет ответа}', ждём $want"
            sleep 15
          done
          echo "Pages так и не опубликовал $want за 10 минут"
          # Падаем осознанно, вместо того чтобы дёрнуть деплой на старых данных:
          # красный прогон видно, и он перезапускается одной кнопкой, а молча
          # собранный лендинг со старой версией никто не заметит.
          exit 1

      # ── Запускаем деплой лендинга ─────────────────────────────────────
      # Репозиторий лендинга приватный и принадлежит другому пользователю,
      # поэтому fine-grained токен здесь не работает в принципе: он умеет
      # выбирать только репозитории своего владельца. Нужен classic PAT со
      # scope repo, заведённый как секрет SITE_DEPLOY_TOKEN.
      - name: Запустить деплой лендинга
        env:
          GH_TOKEN: ${{ secrets.SITE_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN}" ]; then
            echo "Не заведён секрет SITE_DEPLOY_TOKEN (classic PAT, scope repo)"
            exit 1
          fi
          gh workflow run deploy.yml --repo Niksimas/AniRate_Site --ref master
          echo "Деплой лендинга запущен: https://github.com/Niksimas/AniRate_Site/actions"
